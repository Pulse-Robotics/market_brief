name: publish

# Runs when you publish a GitHub Release. Builds the package from the release's
# tag and uploads it to PyPI using Trusted Publishing (no API tokens stored).
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags are needed for the version number
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build      # makes dist/*.whl and dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi             # must match the environment name set on PyPI
    permissions:
      id-token: write             # lets PyPI verify this workflow; no secrets needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1